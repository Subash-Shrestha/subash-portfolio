:root{
  --bg:#0E0F12; --card:#17181D; --card-hi:#1D1F26; --line:#2A2C34;

}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]){
    --bg:#F3F4F6; --card:#FFFFFF; --card-hi:#ECEEF1; --line:#DFE2E7;
    --text:#14161B; --text-soft:#52565F; --text-faint:#868A93;
    --coral:#E8542E; --lime:#4F8F1E; --sky:#2170D8; --violet:#7C4FE0; --pink:#D93E80;
    --nav-bg:rgba(243,244,246,0.75);
    --danger:#C23B1F;
    --on-accent:#FFFFFF;
  }
}
:root[data-theme="light"]{
  --bg:#F3F4F6; --card:#FFFFFF; --card-hi:#ECEEF1; --line:#DFE2E7;
  --text:#14161B; --text-soft:#52565F; --text-faint:#868A93;
  --coral:#E8542E; --lime:#4F8F1E; --sky:#2170D8; --violet:#7C4FE0; --pink:#D93E80;
  --nav-bg:rgba(243,244,246,0.75);
  --danger:#C23B1F;
  --on-accent:#FFFFFF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; transition:background .4s ease, color .4s ease;}
h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:-0.01em; margin:0;}

nav{position:sticky; top:0; z-index:30; backdrop-filter:blur(14px); background:var(--nav-bg); border-bottom:1px solid var(--line);}
.nav-inner{max-width:1280px; margin:0 auto; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;}
.brand-link{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; font-family:var(--font-display); color:var(--text); text-decoration:none;}
.brand-link svg{width:14px; height:14px; stroke:var(--text-faint);}
.nav-right{display:flex; align-items:center; gap:12px;}
.theme-toggle{
  position:relative; width:34px; height:34px; border-radius:50%;
  background:var(--card-hi); border:1px solid var(--line); cursor:pointer;
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  transition:border-color .2s ease, background .4s ease, transform .3s ease;
}
.theme-toggle:hover{border-color:var(--coral); transform:translateY(-1px);}
.theme-toggle svg{position:absolute; width:16px; height:16px; stroke:var(--text); fill:none; stroke-width:1.8; transition:opacity .35s ease, transform .5s cubic-bezier(.2,.8,.2,1);}
.theme-toggle .icon-sun{opacity:0; transform:rotate(-90deg) scale(.4);}
.theme-toggle .icon-moon{opacity:1; transform:rotate(0) scale(1);}
:root[data-theme="light"] .theme-toggle .icon-sun{opacity:1; transform:rotate(0) scale(1);}
:root[data-theme="light"] .theme-toggle .icon-moon{opacity:0; transform:rotate(90deg) scale(.4);}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .theme-toggle .icon-sun{opacity:1; transform:rotate(0) scale(1);}
  :root:not([data-theme="dark"]) .theme-toggle .icon-moon{opacity:0; transform:rotate(90deg) scale(.4);}
}
.btn-signout{padding:8px 14px; border-radius:20px; background:transparent; border:1px solid var(--line); color:var(--text-soft); cursor:pointer; font-family:var(--font-body); font-size:12.5px; font-weight:600;}
.btn-signout:hover{border-color:var(--coral); color:var(--text);}

.gate{display:flex; align-items:center; justify-content:center; min-height:60vh; padding:20px; text-align:center; color:var(--text-faint); font-size:13px;}

.shell{display:none; max-width:1280px; margin:0 auto; padding:24px; gap:24px;}

.sidebar{width:220px; flex-shrink:0;}

.side-link{display:block; padding:9px 12px; border-radius:8px; color:var(--text-soft); text-decoration:none; font-size:13px; margin-bottom:2px; transition:background .15s ease, color .15s ease;}
.side-link:hover{background:var(--card-hi); color:var(--text);}
.side-link.active{background:var(--card); color:var(--text); font-weight:600; border:1px solid var(--line);}

.main{flex:1; min-width:0; padding-bottom:100px;}
.panel{display:none;}
.panel.active{display:block;}
.panel-head{margin-bottom:20px;}
.panel-head h1{font-size:20px;}
.panel-head .sub{font-size:12.5px; color:var(--text-faint); margin-top:4px; line-height:1.6;}

.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
.field label{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); display:block; margin-bottom:6px;}
.field input, .field textarea, .field select{
  width:100%; background:var(--card); border:1px solid var(--line); border-radius:8px;
  color:var(--text); padding:10px 12px; font-size:13.5px; font-family:var(--font-body); outline:none;
}
.field textarea{resize:vertical; line-height:1.5;}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--coral);}

.simple-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px;}

.list-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
.list-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
.list-card-head .idx{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); font-weight:600;}
.list-card-actions{display:flex; gap:6px;}
.icon-btn{width:28px; height:28px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; line-height:1;}
.icon-btn:hover{border-color:var(--coral); color:var(--text);}
.icon-btn.danger:hover{border-color:var(--danger); color:var(--danger);}
.add-item-btn{width:100%; padding:12px; border-radius:10px; border:1px dashed var(--line); background:transparent; color:var(--text-soft); cursor:pointer; font-family:var(--font-body); font-size:13px; font-weight:600;}
.add-item-btn:hover{border-color:var(--coral); color:var(--text);}

.seo-note{background:rgba(107,184,255,0.08); border:1px solid rgba(107,184,255,0.25); border-radius:10px; padding:12px 14px; font-size:12px; color:var(--text-soft); line-height:1.6; margin-bottom:18px;}
.overview-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:18px;}

.overview-stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px;}
.overview-stat .n{font-size:22px; font-weight:700; font-family:var(--font-display);}
.overview-stat .l{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;}

.save-bar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--card); border-top:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:center;}

const themeToggle = document.getElementById('theme-toggle');
function currentTheme(){
  const attr = document.documentElement.getAttribute('data-theme');
  if(attr) return attr;
  return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
themeToggle.addEventListener('click', ()=>{
  const next = currentTheme() === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('theme', next); }catch(e){}
});

  skills: { itemLabel:'Skill', fields:[{key:'name',label:'Skill name'},{key:'pct',label:'Proficiency % (0–100)'}] },
  experience: {
    itemLabel:'Role', fields:[
      {key:'date', label:'Dates'}, {key:'title', label:'Role title'}, {key:'title_note', label:'Title note (optional, e.g. "(Freelance)")'},
      {key:'org', label:'Organization'}, {key:'description', label:'Description', multiline:true},
    ],
  },
  duel_rounds: {
    itemLabel:'Round', fields:[
      {key:'a', label:'Option A'}, {key:'b', label:'Option B'},
      {key:'correct', label:'Correct answer', type:'select', options:[['a','Option A'],['b','Option B']]},
      {key:'verdict', label:'Verdict text'}, {key:'insight', label:'Insight text', multiline:true},
    ],
  },
  blog_posts: {
    itemLabel:'Post', fields:[
      {key:'href', label:'LinkedIn post URL'},
      {key:'image_url', label:'Image URL (leave blank to keep current image)'},
      {key:'alt', label:'Image alt text'},
      {key:'title', label:'Title'}, {key:'description', label:'Description', multiline:true},
      {key:'meta_left', label:'Meta (left) — e.g. "Jul 2026 · 18 reactions"'},
      {key:'meta_right', label:'Meta (right) — e.g. "Read on LinkedIn →"'},
    ],
  },
  articles: {
    itemLabel:'Article', fields:[
      {key:'href', label:'Article/post URL'},
      {key:'image_url', label:'Image URL (leave blank to keep current image)'},
      {key:'alt', label:'Image alt text'},
      {key:'title', label:'Title'}, {key:'description', label:'Description', multiline:true},
      {key:'meta_left', label:'Meta (left) — e.g. "Jul 2020 · New Business Age"'},
      {key:'meta_right', label:'Meta (right) — e.g. "Read the feature →"'},
    ],
  },
  off_pitch: { itemLabel:'Hobby', fields:[{key:'title',label:'Title'},{key:'description',label:'Description'}] },
  fit_items: { itemLabel:'Item', fields:[{key:'need',label:'Need statement'},{key:'proof',label:'Proof statement',multiline:true}] },
  faq: { itemLabel:'Question', fields:[{key:'question',label:'Question'},{key:'answer',label:'Answer',multiline:true}] },
};

const NAV_ITEMS = [
  {id:'overview', label:'Overview'},
  {id:'hero', label:'Hero & Stats'},
  {id:'about', label:'About'},
  {id:'campaigns', label:'Campaigns'},
  {id:'skills', label:'Skills'},
  {id:'experience', label:'Experience'},
  {id:'journey', label:'Journey'},
  {id:'blog', label:'Blog'},
  {id:'articles', label:'Articles'},
  {id:'off_pitch', label:'Off the Pitch'},
  {id:'fit_items', label:'Why Hire Me'},
  {id:'faq', label:'FAQ'},
  {id:'contact', label:'Contact & Social'},
  {id:'seo', label:'SEO & AI Visibility'},
];

let state = null;
let loggedInEmail = null;

function buildSimplePanel(container, fields){
  container.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'simple-card';
  fields.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const label = document.createElement('label');
    label.textContent = f.label;
    wrap.appendChild(label);
    const input = document.createElement(f.multiline ? 'textarea' : 'input');
    if (f.multiline) input.rows = 3;
    else input.type = 'text';
    input.value = state[f.key] || '';
    input.addEventListener('input', () => { state[f.key] = input.value; });
    wrap.appendChild(input);
    card.appendChild(wrap);
  });
  container.appendChild(card);
}

function buildListPanel(container, sectionKey, fields, itemLabel){
  container.innerHTML = '';
  const listWrap = document.createElement('div');
  container.appendChild(listWrap);

  function renderCard(item, idx, arr){
    const card = document.createElement('div');
    card.className = 'list-card';
    const head = document.createElement('div');
    head.className = 'list-card-head';
    const idxEl = document.createElement('span');
    idxEl.className = 'idx';
    idxEl.textContent = itemLabel + ' ' + (idx + 1);
    const actions = document.createElement('div');
    actions.className = 'list-card-actions';
    const up = document.createElement('button'); up.className='icon-btn'; up.type='button'; up.textContent='↑'; up.title='Move up';
    up.disabled = idx === 0;
    up.addEventListener('click', () => { if (idx>0){ [arr[idx-1],arr[idx]] = [arr[idx],arr[idx-1]]; renderList(); } });
    const down = document.createElement('button'); down.className='icon-btn'; down.type='button'; down.textContent='↓'; down.title='Move down';
    down.disabled = idx === arr.length - 1;
    down.addEventListener('click', () => { if (idx<arr.length-1){ [arr[idx+1],arr[idx]] = [arr[idx],arr[idx+1]]; renderList(); } });
    const del = document.createElement('button'); del.className='icon-btn danger'; del.type='button'; del.textContent='✕'; del.title='Remove';
    del.addEventListener('click', () => { arr.splice(idx,1); renderList(); });
    actions.appendChild(up); actions.appendChild(down); actions.appendChild(del);
    head.appendChild(idxEl); head.appendChild(actions);
    card.appendChild(head);
    fields.forEach(f => {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const label = document.createElement('label');
      label.textContent = f.label;
      wrap.appendChild(label);
      let input;
      if (f.type === 'select'){
        input = document.createElement('select');
        f.options.forEach(([val,text]) => {
          const opt = document.createElement('option');
          opt.value = val; opt.textContent = text;
          if (item[f.key] === val) opt.selected = true;
          input.appendChild(opt);
        });
      } else {
        input = document.createElement(f.multiline ? 'textarea' : 'input');
        if (f.multiline) input.rows = 3; else input.type = 'text';
        input.value = item[f.key] != null ? item[f.key] : '';
      }
      input.addEventListener('input', () => { item[f.key] = input.value; });
      if (f.type === 'select') input.addEventListener('change', () => { item[f.key] = input.value; });
      wrap.appendChild(input);
      card.appendChild(wrap);
    });
    return card;
  }

  function renderList(){
    listWrap.innerHTML = '';
    state[sectionKey].forEach((item, idx) => listWrap.appendChild(renderCard(item, idx, state[sectionKey])));
  }
  renderList();

  const addBtn = document.createElement('button');
  addBtn.className = 'add-item-btn';
  addBtn.type = 'button';
  addBtn.textContent = '+ Add ' + itemLabel.toLowerCase();
  addBtn.addEventListener('click', () => {
    const blank = {};
    fields.forEach(f => { blank[f.key] = f.type === 'select' ? f.options[0][0] : ''; });
    state[sectionKey].push(blank);
    renderList();
  });
  container.appendChild(addBtn);
}

function buildOverviewPanel(container){
  container.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'simple-card';
  card.innerHTML = '<p style="margin:0 0 6px; font-size:14px; line-height:1.7; color:var(--text-soft);">Everything here writes to one Supabase table and goes live on the site the moment you hit <b>Save changes</b> at the bottom — no redeploy needed.</p><p style="margin:0; font-size:13px; color:var(--text-faint); line-height:1.7;">Use the sidebar to jump to a section. List sections (Campaigns, Skills, Experience, Blog, Articles, Off the Pitch, Why Hire Me, FAQ, Journey rounds) support adding, removing, and reordering items.</p>';
  container.appendChild(card);
  const grid = document.createElement('div');
  grid.className = 'overview-grid';
  const counts = [
    ['campaigns','Campaigns'], ['skills','Skills'], ['experience','Experience roles'],
    ['blog_posts','Blog posts'], ['articles','Articles'], ['faq','FAQ items'],
  ];
  counts.forEach(([key,label]) => {
    const stat = document.createElement('div');
    stat.className = 'overview-stat';
    const n = document.createElement('div'); n.className='n'; n.textContent = (state[key]||[]).length;
    const l = document.createElement('div'); l.className='l'; l.textContent = label;
    stat.appendChild(n); stat.appendChild(l);
    grid.appendChild(stat);
  });
  container.appendChild(grid);
}

function buildSEOPanel(container){
  container.innerHTML = '';
  const note = document.createElement('div');
  note.className = 'seo-note';
  note.innerHTML = '<b>How this works:</b> Page title and meta description update live and help Google\'s indexed listing over time. They do <b>not</b> change how the page looks when shared on Facebook, LinkedIn, Twitter/X, or Slack — those platforms read the page\'s static source directly and never run JavaScript, so their preview cards always use the site\'s built-in defaults. Structured data (the machine-readable summary AI systems and Google read) is generated automatically from your Skills and Contact & Social sections — nothing to edit here.';
  container.appendChild(note);
  buildSimplePanel(container, SIMPLE_SECTIONS.seo);
  // buildSimplePanel replaces container.innerHTML, so re-add the note after
  container.insertBefore(note, container.firstChild);
}

function renderAllPanels(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'panel-' + item.id;
    const head = document.createElement('div');
    head.className = 'panel-head';
    const h1 = document.createElement('h1'); h1.textContent = item.label;
    head.appendChild(h1);
    panel.appendChild(head);
    const body = document.createElement('div');
    panel.appendChild(body);
    main.appendChild(panel);

    if (item.id === 'overview') buildOverviewPanel(body);
    else if (item.id === 'seo') buildSEOPanel(body);
    else if (SIMPLE_SECTIONS[item.id]) buildSimplePanel(body, SIMPLE_SECTIONS[item.id]);
    else if (LIST_SECTIONS[item.id]) buildListPanel(body, item.id, LIST_SECTIONS[item.id].fields, LIST_SECTIONS[item.id].itemLabel);
  });
}

function renderSidebar(){
  const nav = document.getElementById('side-nav');
  nav.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    const a = document.createElement('a');
    a.className = 'side-link';
    a.href = '#' + item.id;
    a.textContent = item.label;
    nav.appendChild(a);
  });
}

function showSection(id){
  if (!NAV_ITEMS.some(i => i.id === id)) id = 'overview';
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
  document.querySelectorAll('.side-link').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
}
window.addEventListener('hashchange', () => showSection(location.hash.replace('#','')));

(async function init(){
  const gate = document.getElementById('gate');
  if (!isConfigured) {
    gate.textContent = 'Backend not connected yet — set SUPABASE_URL and SUPABASE_ANON_KEY in this file. See supabase/README.md.';
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }
  loggedInEmail = session.user.email;

  const { data } = await sb.from('site_content').select('content').eq('id', 1).single();
  state = Object.assign({}, DEFAULT_CONTENT, (data && data.content) || {});
  // Arrays must exist even if not yet saved, so list editors have something to render.
  Object.keys(LIST_SECTIONS).forEach(key => { if (!Array.isArray(state[key]) || !state[key].length) state[key] = DEFAULT_CONTENT[key]; });

  renderSidebar();
  renderAllPanels();
  showSection(location.hash.replace('#','') || 'overview');

  gate.style.display = 'none';
  document.getElementById('shell').classList.add('open');
  document.getElementById('save-bar').style.display = 'flex';
})();

document.getElementById('save-content').addEventListener('click', async () => {
  const statusEl = document.getElementById('save-status');
  const { error } = await sb.from('site_content').update({ content: state }).eq('id', 1);
  if (error) {
    statusEl.textContent = "Couldn't save — check the RLS policy allows updates for authenticated users.";
  } else {
    statusEl.textContent = 'Saved ✓ — live for every visitor now.';
  }
  setTimeout(() => statusEl.textContent = '', 3000);
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  if (isConfigured) await sb.auth.signOut();
  window.location.href = 'login.html';
});
</script>
</body>
</html>
